name: Feature proposal
description: Explain a useful owner task and how to verify the outcome.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Owner problem
      description: Who needs this and what current task is difficult?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior and success check
      description: Include financial/evidence/approval boundaries that matter. Use synthetic examples.
    validations:
      required: true
